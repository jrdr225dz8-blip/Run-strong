<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Run Strong">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Run Strong</title>
</head>
<body>
<div class="shell">
  <header class="top">
    <img class="logo" src="icon-192.png" alt="Run Strong">
    <div class="brand">
      <div class="brand-main">RUN STRONG</div>
      <div class="brand-sub">RUNNER STRENGTH</div>
    </div>
    <button id="menuBtn" class="icon-btn" aria-label="Menu">•••</button>
  </header>

  <main id="app"></main>

  <nav class="bottom-nav">
    <button data-tab="today" class="nav active"><span>●</span><small>Today</small></button>
    <button data-tab="plan" class="nav"><span>▦</span><small>Plan</small></button>
    <button data-tab="progress" class="nav"><span>↗</span><small>Progress</small></button>
    <button data-tab="recovery" class="nav"><span>✦</span><small>Recovery</small></button>
  </nav>
</div>

<dialog id="bodyDialog">
<form method="dialog" id="bodyForm">
  <button class="x" value="cancel">×</button>
  <h2>Quick body check</h2>
  <p class="muted">This adjusts lower-body volume before you start.</p>
  <label>Knee pain <b id="kneeOut">0</b>/10<input id="knee" type="range" min="0" max="10" value="0"></label>
  <label>Calf / Achilles <b id="calfOut">0</b>/10<input id="calf" type="range" min="0" max="10" value="0"></label>
  <label>Overall soreness <b id="soreOut">0</b>/10<input id="sore" type="range" min="0" max="10" value="0"></label>
  <label>Energy<select id="energy"><option value="5">5 — great</option><option value="4">4 — good</option><option value="3" selected>3 — okay</option><option value="2">2 — low</option><option value="1">1 — wiped</option></select></label>
  <button class="primary" id="saveBody" value="default">Use check-in</button>
</form>
</dialog>

<dialog id="moveDialog"><div id="moveContent"></div></dialog>
<dialog id="addDialog"><div id="addContent"></div></dialog>

<script src="app.js"></script>
</body>
</html>
